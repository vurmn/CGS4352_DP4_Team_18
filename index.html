<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NeedCheck</title>
  <meta name="description" content="NeedCheck explains what apps and sites ask for in plain words, answers for you with privacy rules you set once, and keeps receipts of everything you shared.">
  <meta name="theme-color" content="#FAF8F5">
  <meta name="color-scheme" content="light">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="NeedCheck">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="assets/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600&display=swap">

  <!-- shared look first, then one file per feature -->
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/controls.css">
  <link rel="stylesheet" href="css/overlays.css">
  <link rel="stylesheet" href="css/account.css">
  <link rel="stylesheet" href="css/help.css">
  <link rel="stylesheet" href="css/onboarding.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/check.css">
  <link rel="stylesheet" href="css/rules.css">
  <link rel="stylesheet" href="css/requests.css">
  <link rel="stylesheet" href="css/receipts.css">
</head>
<body>
  <div class="stage">
    <div class="device">
      <div class="app" id="app">
        <div class="statusbar" aria-hidden="true">
          <span class="statusbar-time">9:41</span>
          <span class="statusbar-icons">
            <span class="sb-signal"><i></i><i></i><i></i><i></i></span>
            <span class="sb-battery"><i></i></span>
          </span>
        </div>

        <main id="view">
          <noscript>
            <div class="noscript">
              <p class="title-lg">NeedCheck needs JavaScript</p>
              <p class="lead">Turn JavaScript on in your browser settings, then reload this page.</p>
            </div>
          </noscript>
        </main>

        <nav class="tabbar" id="tabbar" aria-label="Tabs" hidden></nav>
      </div>
    </div>
  </div>

  <!-- every file only registers things; app.js runs last and starts the router -->
  <script defer src="js/core/dom.js"></script>
  <script defer src="js/core/icons.js"></script>
  <script defer src="js/core/controls.js"></script>
  <script defer src="js/core/router.js"></script>
  <script defer src="js/core/store.js"></script>
  <script defer src="js/core/ui.js"></script>
  <script defer src="js/data/users.js"></script>
  <script defer src="js/data/apps.js"></script>
  <script defer src="js/data/requests.js"></script>
  <script defer src="js/data/rules.js"></script>
  <script defer src="js/data/receipts.js"></script>
  <script defer src="js/screens/account.js"></script>
  <script defer src="js/screens/help.js"></script>
  <script defer src="js/screens/onboarding.js"></script>
  <script defer src="js/screens/home.js"></script>
  <script defer src="js/screens/check.js"></script>
  <script defer src="js/screens/rules.js"></script>
  <script defer src="js/screens/requests.js"></script>
  <script defer src="js/screens/receipts.js"></script>
  <script defer src="js/app.js"></script>
</body>
</html>
